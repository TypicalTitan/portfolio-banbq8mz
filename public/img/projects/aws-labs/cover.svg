<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>CloudFormation stack list with a guardrails stack deployed and labs ready</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif}.m{font-family:'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace}.h{stroke:#ffd1dc;stroke-opacity:.12;stroke-width:1.5}</style><defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#ff3b6b"/><stop offset="1" stop-color="#ff7a95"/></linearGradient><linearGradient id="term" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0306"/><stop offset="1" stop-color="#14060b"/></linearGradient><radialGradient id="glow" cx=".8" cy="0" r=".9"><stop offset="0" stop-color="#ff3b6b" stop-opacity=".28"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx=".1" cy="1" r=".8"><stop offset="0" stop-color="#4a1f4f" stop-opacity=".5"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#0d0509"/><rect width="1600" height="1000" fill="url(#glow)"/><rect width="1600" height="1000" fill="url(#glow2)"/><text x="64" y="80" font-size="20"><tspan fill="#b9a9ae">AWS labs</tspan><tspan fill="#8f7d83">  /  </tspan><tspan fill="#fbf3f5" font-weight="600">Stacks</tspan></text><text x="64" y="160" font-size="15" font-weight="700" fill="#ff7a95" letter-spacing="2">CLOUDFORMATION · CDK</text><text x="64" y="206" font-size="40" font-weight="800" fill="#fbf3f5">Certification labs</text><rect x="64" y="244" width="1000" height="600" rx="24" fill="url(#term)" class="h"/><path d="M64,290V268a24,24 0 0 1 24,-24H1040a24,24 0 0 1 24,24V290Z" fill="url(#acc)" opacity=".85"/><text x="92" y="274" class="m" font-size="15" font-weight="700" fill="#16020a" letter-spacing="1.5">STACKS</text><text x="96" y="340" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">$ </tspan><tspan fill="#fbf3f5" font-weight="700">cfn-lint labs/**/*.yaml</tspan></text><text x="96" y="384" class="m" font-size="21" xml:space="preserve"><tspan fill="#7ee2a8">✔ </tspan><tspan fill="#e8dade">21 templates, no errors</tspan></text><text x="96" y="454" class="m" font-size="21" xml:space="preserve"><tspan fill="#ff7a95" font-weight="700">w1-guardrails  </tspan><tspan fill="#7ee2a8">CREATE_COMPLETE</tspan></text><text x="96" y="498" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  budget        </tspan><tspan fill="#e8dade">small monthly limit</tspan></text><text x="96" y="542" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  alarm         </tspan><tspan fill="#e8dade">billing alarm</tspan></text><text x="96" y="586" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  sns           </tspan><tspan fill="#e8dade">email notification</tspan></text><text x="96" y="656" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">saa-c03  </tspan><tspan fill="#e8dade">labs keyed to course sections</tspan></text><text x="96" y="700" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">soa-c03  </tspan><tspan fill="#e8dade">labs keyed to course sections</tspan></text><rect x="1112" y="244" width="424" height="600" rx="22" fill="#140609" class="h"/><text x="1140" y="296" font-size="24" font-weight="700" fill="#fbf3f5">Lab set</text><text x="1140" y="324" font-size="16" fill="#b9a9ae">Two associate exams</text><path d="M1140,350H1508" class="h"/><text x="1140" y="410" font-size="44" font-weight="800" fill="url(#acc)">21</text><text x="1140" y="442" font-size="16" fill="#b9a9ae">labs, cfn-lint clean</text><text x="1140" y="528" font-size="44" font-weight="800" fill="url(#acc)">1</text><text x="1140" y="560" font-size="16" fill="#b9a9ae">stack deployed: guardrails</text><text x="1140" y="646" font-size="44" font-weight="800" fill="url(#acc)">2</text><text x="1140" y="678" font-size="16" fill="#b9a9ae">exams: SAA-C03 and SOA-C03</text><rect x="1140" y="744" width="160" height="34" rx="17" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".45"/><text x="1220.0" y="767" font-size="15" font-weight="600" fill="#ffd1dc" text-anchor="middle">CloudFormation</text><rect x="1310" y="744" width="96" height="34" rx="17" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".45"/><text x="1358.0" y="767" font-size="15" font-weight="600" fill="#ffd1dc" text-anchor="middle">AWS CDK</text><rect x="1416" y="744" width="59" height="34" rx="17" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".45"/><text x="1445.5" y="767" font-size="15" font-weight="600" fill="#ffd1dc" text-anchor="middle">IAM</text></svg>