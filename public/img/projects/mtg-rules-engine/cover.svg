<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Terminal running the MTG rules engine test suite beside card-coverage stats</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif}.m{font-family:'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace}.h{stroke:#ffd1dc;stroke-opacity:.12;stroke-width:1.5}</style><defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#b69cff"/></linearGradient><linearGradient id="term" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0306"/><stop offset="1" stop-color="#14060b"/></linearGradient><radialGradient id="glow" cx=".8" cy="0" r=".9"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx=".1" cy="1" r=".8"><stop offset="0" stop-color="#4a1f4f" stop-opacity=".5"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#0d0509"/><rect width="1600" height="1000" fill="url(#glow)"/><rect width="1600" height="1000" fill="url(#glow2)"/><text x="64" y="80" font-size="20"><tspan fill="#b9a9ae">MTG engine</tspan><tspan fill="#8f7d83">  /  </tspan><tspan fill="#fbf3f5" font-weight="600">Test Output</tspan></text><text x="64" y="160" font-size="15" font-weight="700" fill="#b69cff" letter-spacing="2">TYPESCRIPT · NODE.JS</text><text x="64" y="206" font-size="40" font-weight="800" fill="#fbf3f5">Rules engine test run</text><rect x="64" y="244" width="1000" height="600" rx="24" fill="url(#term)" class="h"/><path d="M64,290V268a24,24 0 0 1 24,-24H1040a24,24 0 0 1 24,24V290Z" fill="url(#acc)" opacity=".85"/><text x="92" y="274" class="m" font-size="15" font-weight="700" fill="#16020a" letter-spacing="1.5">TEST OUTPUT</text><text x="96" y="340" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">$ </tspan><tspan fill="#fbf3f5" font-weight="700">npm test</tspan></text><text x="96" y="384" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83"># node:test  ·  Comprehensive Rules 2026-08-07</tspan></text><text x="96" y="454" class="m" font-size="21" xml:space="preserve"><tspan fill="#7ee2a8">✔ </tspan><tspan fill="#e8dade">priority passes and the stack resolves</tspan></text><text x="96" y="498" class="m" font-size="21" xml:space="preserve"><tspan fill="#7ee2a8">✔ </tspan><tspan fill="#e8dade">state-based actions after each resolution</tspan></text><text x="96" y="542" class="m" font-size="21" xml:space="preserve"><tspan fill="#7ee2a8">✔ </tspan><tspan fill="#e8dade">hidden info: hands stay private per player</tspan></text><text x="96" y="586" class="m" font-size="21" xml:space="preserve"><tspan fill="#7ee2a8">✔ </tspan><tspan fill="#e8dade">imported Oracle text compiles as expected</tspan></text><text x="96" y="656" class="m" font-size="21" xml:space="preserve"><tspan fill="#b69cff" font-weight="700">tests  </tspan><tspan fill="#fbf3f5" font-weight="700">7672</tspan><tspan fill="#8f7d83">   pass </tspan><tspan fill="#7ee2a8">7672</tspan><tspan fill="#8f7d83">   fail </tspan><tspan fill="#fbf3f5" font-weight="700">0</tspan><tspan fill="#8f7d83">   skip </tspan><tspan fill="#fbf3f5" font-weight="700">0</tspan></text><text x="96" y="700" class="m" font-size="21" xml:space="preserve"><tspan fill="#b69cff" font-weight="700">cards  </tspan><tspan fill="#fbf3f5" font-weight="700">22676</tspan><tspan fill="#8f7d83"> / 38626 fully expressed</tspan></text><rect x="1112" y="244" width="424" height="600" rx="22" fill="#140609" class="h"/><text x="1140" y="296" font-size="24" font-weight="700" fill="#fbf3f5">Card coverage</text><text x="1140" y="324" font-size="16" fill="#b9a9ae">Latest commit</text><path d="M1140,350H1508" class="h"/><text x="1140" y="410" font-size="44" font-weight="800" fill="url(#acc)">58.7%</text><text x="1140" y="442" font-size="16" fill="#b9a9ae">of 38,626 cards fully expressed</text><text x="1140" y="528" font-size="44" font-weight="800" fill="url(#acc)">7,672</text><text x="1140" y="560" font-size="16" fill="#b9a9ae">tests, none failing or skipped</text><text x="1140" y="646" font-size="44" font-weight="800" fill="url(#acc)">751</text><text x="1140" y="678" font-size="16" fill="#b9a9ae">commits in about a month</text><rect x="1140" y="744" width="124" height="34" rx="17" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="1202.0" y="767" font-size="15" font-weight="600" fill="#ddd0ff" text-anchor="middle">TypeScript</text><rect x="1274" y="744" width="96" height="34" rx="17" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="1322.0" y="767" font-size="15" font-weight="600" fill="#ddd0ff" text-anchor="middle">Node.js</text><rect x="1380" y="744" width="114" height="34" rx="17" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="1437.0" y="767" font-size="15" font-weight="600" fill="#ddd0ff" text-anchor="middle">node:test</text></svg>