<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Frame-time trace with a stutter spike and its attributed root cause</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif}.m{font-family:'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace}.h{stroke:#ffd1dc;stroke-opacity:.12;stroke-width:1.5}</style><defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffb000"/></linearGradient><linearGradient id="term" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0306"/><stop offset="1" stop-color="#14060b"/></linearGradient><radialGradient id="glow" cx=".8" cy="0" r=".9"><stop offset="0" stop-color="#ff7a00" stop-opacity=".28"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx=".1" cy="1" r=".8"><stop offset="0" stop-color="#4a1f4f" stop-opacity=".5"/><stop offset="1" stop-color="#0d0509" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#0d0509"/><rect width="1600" height="1000" fill="url(#glow)"/><rect width="1600" height="1000" fill="url(#glow2)"/><text x="64" y="80" font-size="20"><tspan fill="#b9a9ae">lagd</tspan><tspan fill="#8f7d83">  /  </tspan><tspan fill="#fbf3f5" font-weight="600">Trace</tspan></text><text x="64" y="160" font-size="15" font-weight="700" fill="#ffb000" letter-spacing="2">C++20 · ETW · PRESENTMON</text><text x="64" y="206" font-size="40" font-weight="800" fill="#fbf3f5">Stutter attribution</text><rect x="64" y="244" width="1000" height="600" rx="24" fill="url(#term)" class="h"/><path d="M64,290V268a24,24 0 0 1 24,-24H1040a24,24 0 0 1 24,24V290Z" fill="url(#acc)" opacity=".85"/><text x="92" y="274" class="m" font-size="15" font-weight="700" fill="#16020a" letter-spacing="1.5">TRACE</text><text x="96" y="340" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">source  </tspan><tspan fill="#e8dade">PresentMon ETW (out of process)</tspan></text><text x="96" y="384" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">clock   </tspan><tspan fill="#e8dade">one timeline for every signal</tspan></text><text x="96" y="454" class="m" font-size="21" xml:space="preserve"><tspan fill="#ffb000" font-weight="700">frame      </tspan><tspan fill="#e8dade">frametime </tspan><tspan fill="#fbf3f5" font-weight="700">spike</tspan></text><text x="96" y="498" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  gpu    </tspan><tspan fill="#e8dade">waiting</tspan></text><text x="96" y="542" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  cpu    </tspan><tspan fill="#e8dade">main thread busy</tspan></text><text x="96" y="586" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">  disk   </tspan><tspan fill="#e8dade">paging reads</tspan></text><text x="96" y="630" class="m" font-size="21" xml:space="preserve"><tspan fill="#ffd98a">  cause  </tspan><tspan fill="#fbf3f5" font-weight="700">disk / paging</tspan></text><text x="96" y="700" class="m" font-size="21" xml:space="preserve"><tspan fill="#8f7d83">record  </tspan><tspan fill="#e8dade">CSV · replay in the GUI</tspan></text><rect x="1112" y="244" width="424" height="600" rx="22" fill="#140609" class="h"/><text x="1140" y="296" font-size="24" font-weight="700" fill="#fbf3f5">Signals</text><text x="1140" y="324" font-size="16" fill="#b9a9ae">Correlated on one clock</text><path d="M1140,350H1508" class="h"/><text x="1140" y="410" font-size="44" font-weight="800" fill="url(#acc)">7</text><text x="1140" y="442" font-size="16" fill="#b9a9ae">kinds of cause checked</text><text x="1140" y="528" font-size="44" font-weight="800" fill="url(#acc)">~4,600</text><text x="1140" y="560" font-size="16" fill="#b9a9ae">frames in a real game trace</text><text x="1140" y="646" font-size="44" font-weight="800" fill="url(#acc)">0</text><text x="1140" y