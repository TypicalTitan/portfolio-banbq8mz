</text><text x="1098" y="648" font-size="23" font-weight="600" fill="#fbf3f5">Uploads when back online</text><text x="1098" y="682" class="m" font-size="17" fill="#b9a9ae">Firebase · last-write-wins</text><path d="M1070,635C1030,635 1030,520 1000,520" fill="none" stroke="#ffd1dc" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6"/><path d="M1180,380h96a34,34 0 0 0 0,-68a50,50 0 0 0 -92,-12a30,30 0 0 0 -4,80z" fill="none" stroke="#ff7a95" stroke-width="4" stroke-linejoin="round"/><path d="M1228,364v-44m-16,16l16,-16l16,16" fill="none" stroke="#ffb000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
