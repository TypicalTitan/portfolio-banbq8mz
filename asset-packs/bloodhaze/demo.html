<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloodhaze demo</title>
<!-- The Bloodhaze film look and avatar decoration in use. Open in a browser; paths are relative. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px max(16px, 3vw) 64px; background: #0b0809; color: #e9dfe1; font: 15px/1.55 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p { margin: 0 0 24px; color: #b3a5a8; max-width: 70ch; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 8px; }
  figcaption { font-size: 13px; color: #9a8c8f; }

  /* ── The film look: the photo gradient-mapped to reds, clouds double-exposed, a coral → violet
     shift with a vignette, then light leak, dust and grain ── */
  .bloodhaze { position: relative; overflow: hidden; isolation: isolate; background: #0a0205; width: 360px; max-width: 100%; aspect-ratio: 4 / 5; }
  .bloodhaze img { display: block; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1) url(#bloodhaze-map); }
  .bloodhaze::before, .bloodhaze::after, .bloodhaze__film { content: ''; position: absolute; inset: 0; pointer-events: none; }
  /* The filtered <img> gets its own stacking layer, so give the overlays an explicit order above it. */
  .bloodhaze::before { z-index: 1; } .bloodhaze__film { z-index: 2; } .bloodhaze::after { z-index: 3; }
  .bloodhaze::before { background: url(film/clouds.png) center 65% / cover no-repeat; mix-blend-mode: screen; opacity: .5; }
  .bloodhaze__film {
    background:
      radial-gradient(120% 90% at 45% 40%, transparent 50%, rgba(10, 2, 5, .7) 100%),
      linear-gradient(100deg, #ffd2c8 0%, #fff 45%, #c9a4ff 100%);
    mix-blend-mode: multiply;
  }
  .bloodhaze::after {
    background:
      url(film/dust.png) center / cover,
      url(film/grain.png) 0 0 / 256px repeat,
      url(film/light-leak.png) center / cover no-repeat;
    mix-blend-mode: screen;
  }

  /* ── Avatar decoration: the avatar fills the inner 240/288 of the decoration's box ── */
  .avatar { position: relative; width: 240px; aspect-ratio: 1; }
  .avatar > .bloodhaze { width: 100%; aspect-ratio: 1; border-radius: 50%; }
  .avatar > .deco { position: absolute; inset: -10%; width: 120%; height: 120%; pointer-events: none; }
</style>
</head>
<body>
  <!-- The gradient map (film/gradient-map.svg), pasted inline so every browser applies it. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="bloodhaze-map" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.04 0.29 0.82 1 1"/>
        <feFuncG type="table" tableValues="0.01 0.02 0.06 0.42 0.84"/>
        <feFuncB type="table" tableValues="0.02 0.07 0.23 0.36 0.82"/>
      </feComponentTransfer>
    </filter>
  </svg>
  <h1>Bloodhaze</h1>
  <p>The same image before and after the film look, and the animated avatar decoration around a filmed avatar. Swap the image for any photo.</p>
  <div class="row">
    <figure>
      <img src="../../public/img/portrait.svg" alt="" width="360" height="450" style="width:360px;max-width:100%;aspect-ratio:4/5;object-fit:cover;display:block">
      <figcaption>Original</figcaption>
    </figure>
    <figure>
      <div class="bloodhaze"><img src="../../public/img/portrait.svg" alt=""><span class="bloodhaze__film" aria-hidden="true"></span></div>
      <figcaption>With the film look</figcaption>
    </figure>
    <figure>
      <div class="avatar">
        <div class="bloodhaze"><img src="../../public/img/portrait.svg" alt=""><span class="bloodhaze__film" aria-hidden="true"></span></div>
        <img class="deco" src="avatar/avatar-decoration.apng" alt="">
      </div>
      <figcaption>Avatar + animated decoration (APNG)</figcaption>
    </figure>
  </div>
</body>
</html>
