<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Bloodhaze gradient map: brightness → black, oxblood, crimson, coral, pale pink.
       Paste this <svg> into your page, then: img { filter: url(#bloodhaze-map); }
       (Chrome only applies filters defined in the same document.) -->
  <filter id="bloodhaze-map" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.04 0.29 0.82 1 1"/>
      <feFuncG type="table" tableValues="0.01 0.02 0.06 0.42 0.84"/>
      <feFuncB type="table" tableValues="0.02 0.07 0.23 0.36 0.82"/>
    </feComponentTransfer>
  </filter>
</svg>
